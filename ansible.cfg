[defaults]

# Default inventory file
inventory = inventory.ini

# Roles path
roles_path = src/roles

# Editor used for interactive commands (e.g., ansible-vault)
editor = nano

# Disable cowsay banners in output
nocows = True

# Silence the Python interpreter discovery warning
interpreter_python = auto_silent
deprecation_warnings = False

# Vault password source:
# Option A (Plaintext File): Point to password file.
# Note: The AI and local processes running as 'toor' can still read this because:
#   1. The exact path is declared here in this workspace config.
#   2. The plaintext file is owned by user 'toor'.
#   3. If the file tab is kept open in the IDE, its content is sent directly in AI context.
vault_password_file = ~/.vault_pass
# Option B (Keyring - Recommended): 0 plaintext files on disk.
# The secret is encrypted in the OS credential store and fetched into memory via executable script:
# vault_password_file = ~/.vault_keyring.sh   # script running: keyring get ansible vault_pass
