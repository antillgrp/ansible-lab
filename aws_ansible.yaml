---

- name: Lab AWS
  hosts: localhost
  connection: local
 
  vars:
    vm_name: demo

  tasks:

  # sudo apt install python3-boto3 -y
  # $HOME/.local/share/pipx/venvs/ansible/bin/python -m pip install boto3 botocore
  - name: Create user and attach managed policy
    community.aws.iam_user:
      name: poweruser
      managed_policies:
        # https://docs.aws.amazon.com/aws-managed-policy/latest/reference/PowerUserAccess.html
        - arn:aws:iam::aws:policy/PowerUserAccess
        # Description: Provides full access to AWS services and resources, but does not allow management of Users and groups.
      state: present
    register: power_user
      
  - name: print all values returned
    debug:
      msg: "{{ power_user.user }}"

  - name: Create an EC2 instance
    # aws ec2 describe-instances  --region us-east-1 --query 'Reservations[*].Instances[*].{Name:Tags[?Key==`Name`]|[0].Value,InstanceId:InstanceId,Type:InstanceType,State:State.Name}' --output table
    amazon.aws.ec2_instance:
      endpoint_url: http://localhost:4566
      name: "EC2-TEST"
      instance_type: t2.micro
      image_id: "ami-df5de72bdb3b"  # LocalStack accepts any ID by default
      region: us-east-1
      # Redirect to LocalStack
    register: ec2_test

  - name: print all values returned
    debug:
      msg: "{{ ec2_test.instances[0].state.name }}"

  - name: print all values returned
    debug:
      msg: "{{ ec2_test.instances[0] }}"

