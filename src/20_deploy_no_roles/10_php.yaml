---
- name: Install php and dependencies
  ansible.builtin.apt:
    name:
      - php
      - php-common
      - php-mysql
      - php-xml
      - php-xmlrpc
      - php-curl
      - php-gd
      - php-imagick
      - php-cli
      - php-dev
      - php-mbstring
      - php-soap
      - php-zip
      - php-intl
    state: present
  no_log: true

